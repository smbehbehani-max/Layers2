<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:L;src:url(../fonts/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:I;src:url(../fonts/Inter-SemiBold.otf);font-weight:600}
@font-face{font-family:I;src:url(../fonts/Inter-Medium.otf);font-weight:500}
html,body{margin:0;background:#fff}
.sq{width:1000px;height:1000px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.sq img{width:520px;height:520px;border-radius:118px;box-shadow:0 18px 40px rgba(60,40,20,.18)}
.w{font:700 132px/1 L,serif;letter-spacing:.06em;color:#1f2a2b}
.s{font:600 38px/1 I,sans-serif;letter-spacing:.32em;color:#b4521c;margin-top:-6px}
.hz{width:1600px;height:500px;display:flex;align-items:center;justify-content:center;gap:56px}
.hz img{width:340px;height:340px;border-radius:78px;box-shadow:0 14px 30px rgba(60,40,20,.18)}
.hz .t{display:flex;flex-direction:column;gap:22px}
.hz .w{font-size:150px}.hz .s{font-size:42px}
</style></head><body>
<div class="sq" id="sq"><img src="../icon-plain-square.svg"><div class="w">LAYERS</div><div class="s">BY GEOHERITAGE</div></div>
<div class="hz" id="hz"><img src="../icon-plain-square.svg"><div class="t"><div class="w">LAYERS</div><div class="s">BY GEOHERITAGE</div></div></div>
</body></html>
