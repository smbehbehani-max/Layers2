<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuwait GeoHeritage Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#e6edee;--panel:#f4f7f7;--ink:#14282e;--mut:#5a6e74;--line:#c3d0d3;--sea:#cfe0e4;--land:#f7f9f6;--arch:#a85a12;--geo:#5a49a0;--eco:#2a7a55;--spec:#b8267a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c20;--panel:#16272c;--ink:#e3ecee;--mut:#8ea3a9;--line:#2a3f45;--sea:#0c171a;--land:#1f353b;--arch:#e39a52;--geo:#a597e6;--eco:#5fc896;--spec:#f06bb5}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{padding:8px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px;background:var(--panel)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.ctl{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.row.ctl>*{flex:none}
h1{font:600 20px "Newsreader",Georgia,serif;margin:0}#count{color:var(--mut);font-size:13px}
.modes{display:flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden;margin-left:auto}
.modes button{border:0;background:transparent;color:var(--ink);padding:5px 14px;font:600 13px inherit;cursor:pointer}
.modes button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input[type=search]{flex:0 0 170px!important;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;max-width:100%}
.chip{flex:none;border:1.5px solid var(--c);color:var(--ink);background:transparent;border-radius:99px;padding:3px 10px;font:500 13px inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--c);color:#fff}.chip.sp{border-style:dashed}
.chk{font-size:13px;color:var(--mut);white-space:nowrap}
#go{border:0;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 12px;font:600 13px inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--geo);outline-offset:2px}
.body{display:grid;grid-template-columns:56px 1fr;min-height:0}
#rail{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:6px;scrollbar-width:thin}
.ri{flex:none;width:42px;height:42px;border-radius:12px;border:2px solid var(--c);background:var(--bg);font-size:21px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.ri.sp{border-style:dashed}.ri[aria-current=true]{background:var(--c);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--c)}
.sep{flex:none;width:28px;height:1px;background:var(--line);margin:2px 0}
main{position:relative;min-height:0;background:var(--sea);overflow:hidden}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.land{fill:var(--land);stroke:var(--mut);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.grat{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.7}
.gl{fill:var(--mut)}.wl{fill:var(--mut);font-style:italic;opacity:.8;text-anchor:middle}
.pt{cursor:pointer;stroke:var(--panel);stroke-width:1.5;vector-effect:non-scaling-stroke}
.pt.sp{fill:var(--panel)!important;stroke:var(--spec);stroke-dasharray:2 1.5;stroke-width:2}
.pt.sel{stroke:var(--ink);stroke-width:3}
.cl{cursor:pointer;fill:var(--ink);stroke:var(--panel);stroke-width:2;vector-effect:non-scaling-stroke}
.clt{fill:var(--bg);font-weight:600;text-anchor:middle;pointer-events:none}
.stop{fill:var(--ink);cursor:pointer;stroke:var(--panel);stroke-width:1;vector-effect:non-scaling-stroke}
.route{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 4;opacity:.5;vector-effect:non-scaling-stroke;pointer-events:none}
.zb{position:absolute;right:10px;top:10px;display:grid;gap:4px}
.zb button{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;font-size:18px;cursor:pointer}
.note{position:absolute;left:8px;bottom:8px;font-size:12px;color:var(--mut);background:var(--panel);padding:3px 8px;border-radius:5px;max-width:calc(100% - 16px)}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:5px;font-size:12px;display:none;white-space:nowrap;z-index:3}
#det{position:absolute;z-index:4;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px 18px 28px;transform:translateX(105%);transition:transform .2s}
#det.on{transform:none}
#det h2{font:600 24px/1.2 "Newsreader",Georgia,serif;margin:0 32px 4px 0}
#det h3{font:600 13px "Instrument Sans";margin:18px 0 4px;color:var(--mut)}
#det p{margin:0 0 8px;max-width:62ch}
.x{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;background:transparent;color:var(--ink);font-size:24px;cursor:pointer}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:10px 0}.meta dt{color:var(--mut)}.meta dd{margin:0}
.warn{border:1.5px dashed var(--spec);border-radius:6px;padding:8px 10px;margin:10px 0;font-size:14px}
#det ul{margin:0;padding-left:18px}#det li{margin-bottom:5px}.refs{font-size:13px;color:var(--mut)}
.story{font:400 17px/1.6 "Newsreader",Georgia,serif}.kick{font-weight:600;color:var(--mut);font-size:14px}
.nav{display:flex;gap:8px;margin-top:18px}.nav button{flex:1;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;padding:10px;font:600 14px inherit;cursor:pointer}
.nav button:last-child{background:var(--ink);color:var(--bg)}.nav button:disabled{opacity:.35;cursor:default}
@media(max-width:760px){#det{top:auto;width:100%;height:58%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(105%)}#det.on{transform:none}.note{display:none}}
@media(prefers-reduced-motion:reduce){#det{transition:none}}
</style></head><body>
<div class="app">
<header>
<div class="row"><h1>Kuwait GeoHeritage Explorer</h1><span id="count"></span><div class="modes" role="group" aria-label="Mode"><button data-m="r" aria-pressed="true">Researcher</button><button data-m="e" aria-pressed="false">Explorer</button></div></div>
<div class="row ctl"><input type="search" id="q" placeholder="Search names, periods, discoveries…" aria-label="Search sites"><div class="chips" id="chips"></div><label class="chk"><input type="checkbox" id="stp" checked> Field stops</label><button id="go" hidden>Begin the expedition</button></div>
</header>
<div class="body"><nav id="rail" aria-label="Sites"></nav>
<main><svg id="map" aria-label="Map of Kuwait sites"></svg>
<div class="zb"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="zr" aria-label="Reset view">⌂</button></div>
<div class="note">Pinch or scroll to zoom. Numbered circles group nearby sites; tap one to zoom in. Dashed rings are unverified, AI-detected features.</div><div id="tip"></div>
<section id="det" aria-live="polite"></section></main></div></div>
<script>
const D=__DATA__,KW=__KW__;
const CAT={archaeological:['Archaeological','--arch'],geological:['Geological','--geo'],ecology:['Ecology','--eco'],speculative:['Speculative (AI-detected)','--spec']};
const CATE={archaeological:'Ancient lives',geological:'Deep Earth',ecology:'Living desert',speculative:'Mysteries'};
const ROUTE=[['bahra-1','The inland village','Start inland, where people were crafting shell ornaments about 7,700 years ago.'],['h3-site','The village by the sea','Follow the old coastline to a fishing village on a narrow peninsula, where the sea once reached.'],['subiyah-tumuli','The mounds in the sand','Jump ahead to 2900–1150 BC, when the Subiyah desert became a place to bury the dead beneath mounds.'],['failaka-island','The island crossroads','Cross the water to Failaka, a place people lived on from 3000 BC into the 17th century AD.'],['kazima-battle-site','633 AD','Back on the mainland, history turns to conflict on the plains of Kazima.'],['jal-az-zor','The long cliff','Now go far deeper in time, to an escarpment built from layers laid down 23 to 5 million years ago.'],['mud-volcano-z1','Mud that rises','Beneath the north-west, mud volcanoes carry a record stretching back about 20 million years.'],['paleo-liquefaction','The day the ground gave way','About 7,000 years ago a single catastrophic event turned sand to liquid and left its mark in the ground.'],['sabah-al-ahmad-reserve','A desert that lives','Today the desert is alive, with a natural reserve established in 2004.'],['spec-seepage-mounds','One more mystery','Last stop: dark circles seen from space that nobody has yet checked on the ground.']].map(a=>({id:a[0],title:a[1],line:a[2]}));
const ICONS=[[/failaka|island/i,'🏝️'],[/H3|boat|torpedo|maritime/i,'⛵'],[/shell|bahra 1/i,'🐚'],[/tumuli|tomb|cemetery/i,'🪦'],[/platform/i,'🗿'],[/well|freshwater/i,'💧'],[/kadhima|kazma 6k/i,'⚓'],[/battle/i,'⚔️'],[/smelter/i,'🔥'],[/wall/i,'🧱'],[/mud volcano|seepage|mud-volcano/i,'🌋'],[/liquefaction|seismite|injectite|sandstone pipes/i,'🌀'],[/fault|flower/i,'⚡'],[/hydrothermal/i,'♨️'],[/sinkhole|karst/i,'🕳️'],[/petrified|permineralized/i,'🪵'],[/fossil|marine bed/i,'🦴'],[/dunes|yardang|varnish|gypcrete/i,'🏜️'],[/sabkha|playa|seismite/i,'🧂'],[/escarpment|polychrome|erratics/i,'⛰️'],[/sea-level|shoreline|paleochannel|khor|submerged|paleotidal|bubiyan coastal/i,'🌊'],[/alluvial|wadi/i,'🏞️'],[/geopark/i,'🗺️'],[/warbler|bird/i,'🐦'],[/mudflat/i,'🦀'],[/mangrove/i,'🌴'],[/oil|burgan|sabriya|gudair/i,'🛢️'],[/military/i,'🎖️'],[/reserve|marsh/i,'🦌'],[/iris|halophyt|arfaj|ecology/i,'🌱'],[/slope/i,'📐']];
const DEF={archaeological:'🏺',geological:'🪨',ecology:'🌿',speculative:'❓'};
function icon(s){const t=s.n+' '+s.s;for(const [r,i] of ICONS)if(r.test(t))return i;return DEF[s.c]}
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const on=new Set(Object.keys(CAT));let mode='r',sel=null,q='',chap=-1,vis=[],clusters=[];
const allPts=D.sites.concat(D.stops).map(a=>[a.lng,a.lat]).concat(KW.flat());
const K=Math.cos(29.4*Math.PI/180),pad=.04;
const X0=Math.min(...allPts.map(p=>p[0]))-pad,X1=Math.max(...allPts.map(p=>p[0]))+pad+.12,Y0=Math.min(...allPts.map(p=>p[1]))-pad,Y1=Math.max(...allPts.map(p=>p[1]))+pad;
const W=(X1-X0)*K*100,H=(Y1-Y0)*100,px=lng=>(lng-X0)*K*100,py=lat=>(Y1-lat)*100;
const svg=$('#map');let vb=[0,0,W,H],home=[0,0,W,H];
const cc=c=>`var(${CAT[c][1]})`;
const LP=KW.map(r=>'M'+r.map(p=>px(p[0]).toFixed(2)+' '+py(p[1]).toFixed(2)).join('L')+'Z').join('');
let g='';for(let l=Math.ceil(X0*4)/4;l<=X1;l+=.25)g+=`<line class="grat" x1="${px(l)}" x2="${px(l)}" y1="-999" y2="999"/><text class="gl" data-x="${px(l)}" data-s="gx">${l}°E</text>`;
for(let l=Math.ceil(Y0*4)/4;l<=Y1;l+=.25)g+=`<line class="grat" y1="${py(l)}" y2="${py(l)}" x1="-999" x2="999"/><text class="gl" data-y="${py(l)}" data-s="gy">${l}°N</text>`;
const WL=[['Kuwait Bay',29.47,47.98],['Persian Gulf',29.3,48.55],['Bubiyan',29.78,48.22],['Failaka',29.37,48.45],['Iraq',30.08,47.3],['Saudi Arabia',28.7,47.2]];
svg.innerHTML=`<path class="land" d="${LP}"/><g>${g}</g><g>${WL.map(w=>`<text class="wl" x="${px(w[2])}" y="${py(w[1])}">${w[0]}</text>`).join('')}</g><path id="rt" class="route"/><g id="stops"></g><g id="pts"></g>`;
const U=()=>vb[2]/svg.clientWidth;
function fit(){const r=svg.getBoundingClientRect(),a=r.width/r.height;let w=W,h=H;if(w/h<a)w=h*a;else h=w/a;vb=[(W-w)/2,(H-h)/2,w,h];home=vb.slice()}
function match(s){return on.has(s.c)&&(!q||(s.n+' '+s.s+' '+s.p+' '+s.dr+' '+s.desc+' '+s.ad+' '+s.disc.join(' ')).toLowerCase().includes(q))}
function setVB(){svg.setAttribute('viewBox',vb.join(' '));const u=U();
svg.querySelectorAll('.gl').forEach(e=>{e.style.fontSize=10*u+'px';if(e.dataset.s=='gx'){e.setAttribute('x',+e.dataset.x+3*u);e.setAttribute('y',vb[1]+vb[3]-4*u)}else{e.setAttribute('y',+e.dataset.y-3*u);e.setAttribute('x',vb[0]+4*u)}});
svg.querySelectorAll('.wl').forEach(e=>e.style.fontSize=12*u+'px');drawPts()}
function drawPts(){const u=U(),T=20*u,cl=[];
vis.forEach(s=>{const x=px(s.lng),y=py(s.lat);if(s.id==sel){cl.push({m:[s],x,y,solo:1});return}
const c=cl.find(c=>!c.solo&&Math.hypot(c.x-x,c.y-y)<T);if(c){c.m.push(s);c.x=(c.x*(c.m.length-1)+x)/c.m.length;c.y=(c.y*(c.m.length-1)+y)/c.m.length}else cl.push({m:[s],x,y})});
clusters=cl;
$('#pts').innerHTML=cl.map((c,i)=>c.m.length>1?`<g><circle class="cl" data-cl="${i}" cx="${c.x}" cy="${c.y}" r="${12*u}"/><text class="clt" x="${c.x}" y="${c.y+4*u}" style="font-size:${12*u}px">${c.m.length}</text></g>`:`<circle class="pt${c.m[0].c=='speculative'?' sp':''}${c.m[0].id==sel?' sel':''}" data-id="${c.m[0].id}" cx="${c.x}" cy="${c.y}" r="${(c.m[0].id==sel?8:5)*u}" style="fill:${cc(c.m[0].c)}"/>`).join('');
const show=$('#stp').checked&&vb[2]<45;
$('#stops').innerHTML=show?D.stops.map(s=>`<path class="stop" data-stop="${s.id}" transform="translate(${px(s.lng)} ${py(s.lat)}) scale(${u})" d="M0,-4L4,0L0,4L-4,0Z"/>`).join(''):''}
function render(){vis=D.sites.filter(match);
$('#count').textContent=`${vis.length} of ${D.sites.length} sites`;
let h='',last='';vis.forEach(s=>{if(last&&s.c!=last)h+='<div class="sep"></div>';last=s.c;h+=`<button class="ri${s.c=='speculative'?' sp':''}" style="--c:${cc(s.c)}" data-id="${s.id}" title="${E(s.n)}" aria-label="${E(s.n)}" ${sel==s.id?'aria-current="true"':''}>${icon(s)}</button>`});
$('#rail').innerHTML=h||'<span style="font-size:11px;color:var(--mut);padding:4px;text-align:center">No match</span>';
$('#rt').setAttribute('d',mode=='e'?'M'+ROUTE.map(c=>{const s=D.sites.find(x=>x.id==c.id);return px(s.lng)+' '+py(s.lat)}).join('L'):'');
setVB();const a=$('#rail [aria-current]');a&&a.scrollIntoView({block:'nearest'})}
function mkChips(){$('#chips').innerHTML=Object.entries(CAT).map(([k,[n,c]])=>`<button class="chip${k=='speculative'?' sp':''}" style="--c:var(${c})" aria-pressed="${on.has(k)}" data-k="${k}">${mode=='e'?CATE[k]:n}</button>`).join('')}mkChips();
$('#chips').onclick=e=>{const k=e.target.dataset.k;if(!k)return;on.has(k)?on.delete(k):on.add(k);e.target.setAttribute('aria-pressed',on.has(k));render()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};$('#stp').onchange=drawPts;
const fd=x=>{const i=x.indexOf(': ');return i>0&&i<60?`<li><b>${E(x.slice(0,i))}</b> ${E(x.slice(i+2))}</li>`:`<li>${E(x)}</li>`};
function setView(cx,cy,w){w=Math.max(1.2,Math.min(w,home[2]*1.15));const a=vb[3]/vb[2];vb=[cx-w/2,cy-w*a/2,w,w*a];setVB()}
function focus(s){const w=Math.min(vb[2],14);setView(px(s.lng),py(s.lat),w);const mob=innerWidth<=760;if(mob)vb[1]+=vb[3]*.2;else vb[0]+=vb[2]*.18;setVB()}
function show(id){const s=D.sites.find(x=>x.id==id);if(!s)return;sel=id;chap=-1;const st=D.stops.filter(x=>x.par==id);const f=(k,v)=>v?`<dt>${k}</dt><dd>${E(v)}</dd>`:'';
$('#det').innerHTML=mode=='e'?`<button class="x" aria-label="Close">×</button><h2>${icon(s)} ${E(s.n)}</h2><div class="kick" style="color:var(${CAT[s.c][1]})">${CATE[s.c]} · ${E(s.dr)}</div>${s.c=='speculative'?'<div class="warn">A mystery. This was spotted from imagery and nobody has confirmed it on the ground yet.</div>':''}<p class="story">${E(s.ad)}</p><h3>What explorers found</h3><ul>${s.disc.slice(0,4).map(fd).join('')}</ul>${st.length?`<h3>Stops along the way</h3><ul>${st.map(x=>`<li>${E(x.obs)}</li>`).join('')}</ul>`:''}<p class="refs">${s.lat}° N, ${s.lng}° E</p>`
:`<button class="x" aria-label="Close">×</button><h2>${icon(s)} ${E(s.n)}</h2><div style="color:var(${CAT[s.c][1]});font-weight:600">${CAT[s.c][0]} · ${E(s.s)}</div>${s.c=='speculative'?'<div class="warn">Hypothesis only. This feature was detected from imagery and needs field verification before it is treated as confirmed.</div>':''}<dl class="meta">${f('Period',s.p)}${f('Dates',s.dr)}${f('Elevation',s.el)}${f('Coordinates',s.lat+'° N, '+s.lng+'° E')}${f('Field mission',s.ex)}${f('Confidence',s.conf)}</dl><h3>Description</h3><p>${E(s.desc)}</p><h3>Significance</h3><p>${E(s.sig)}</p>${s.ev?`<h3>Evidence</h3><p>${E(s.ev)}</p>`:''}${s.an?`<h3>Analog</h3><p>${E(s.an)}</p>`:''}${s.val?`<h3>Validation required</h3><p>${E(s.val)}</p>`:''}<h3>Key discoveries</h3><ul>${s.disc.map(x=>`<li>${E(x)}</li>`).join('')}</ul>${st.length?`<h3>Field-mission stops</h3><ul>${st.map(x=>`<li><b>${E(x.n)}</b> (${x.lat}, ${x.lng}): ${E(x.obs)}</li>`).join('')}</ul>`:''}<h3>References</h3><ul class="refs">${s.refs.map(x=>`<li>${E(x)}</li>`).join('')}</ul>`;
$('#det').classList.add('on');$('#det').scrollTop=0;focus(s);render()}
function chapter(i){chap=i;const c=ROUTE[i],s=D.sites.find(x=>x.id==c.id);sel=c.id;
$('#det').innerHTML=`<button class="x" aria-label="End expedition">×</button><div class="kick">Chapter ${i+1} of ${ROUTE.length}</div><h2>${E(c.title)}</h2><p>${E(c.line)}</p><h3>${icon(s)} ${E(s.n)} · ${E(s.dr)}</h3><p class="story">${E(s.ad)}</p><ul>${s.disc.slice(0,2).map(fd).join('')}</ul><div class="nav"><button data-nav="-1" ${i?'':'disabled'}>Back</button><button data-nav="1">${i==ROUTE.length-1?'Finish':'Next stop'}</button></div>`;
$('#det').classList.add('on');$('#det').scrollTop=0;focus(s);render()}
function closeDet(){$('#det').classList.remove('on');sel=null;chap=-1;render()}
$('#det').onclick=e=>{const d=e.target.dataset.nav;if(e.target.classList.contains('x'))closeDet();else if(d){const n=chap+ +d;n>=ROUTE.length?closeDet():chapter(n)}};
addEventListener('keydown',e=>{if(e.key=='Escape')closeDet()});
$('#go').onclick=()=>chapter(0);
$('#rail').onclick=e=>{const b=e.target.closest('button');b&&show(b.dataset.id)};
$('.modes').onclick=e=>{const m=e.target.dataset.m;if(!m||m==mode)return;mode=m;document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m==mode));$('#go').hidden=mode!='e';$('#q').placeholder=mode=='e'?'Search places, boats, mud volcanoes…':'Search names, periods, discoveries…';mkChips();closeDet()};
// pan / pinch / wheel
const ptrs=new Map();let moved=false,down=null;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size==1){moved=false;down={x:e.clientX,y:e.clientY}}else moved=true});
const rel=(x,y)=>{const r=svg.getBoundingClientRect();return[(x-r.left)/r.width,(y-r.top)/r.height]};
function zm(f,fx,fy){const w=Math.max(1.2,Math.min(vb[2]/f,home[2]*1.15)),k=w/vb[2],h=vb[3]*k;vb=[vb[0]+(vb[2]-w)*fx,vb[1]+(vb[3]-h)*fy,w,h];setVB()}
addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
if(ptrs.size==1){const dx=e.clientX-p.x,dy=e.clientY-p.y;if(!moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>6)moved=true;if(moved){const u=U();vb[0]-=dx*u;vb[1]-=dy*u;p.x=e.clientX;p.y=e.clientY;setVB()}}
else if(ptrs.size==2){const o=[...ptrs.entries()].find(([id])=>id!=e.pointerId)[1];const d0=Math.hypot(p.x-o.x,p.y-o.y),m0=[(p.x+o.x)/2,(p.y+o.y)/2];p.x=e.clientX;p.y=e.clientY;const d1=Math.hypot(p.x-o.x,p.y-o.y),m1=[(p.x+o.x)/2,(p.y+o.y)/2];const u=U();vb[0]-=(m1[0]-m0[0])*u;vb[1]-=(m1[1]-m0[1])*u;if(d0>0){const[fx,fy]=rel(m1[0],m1[1]);zm(d1/d0,fx,fy)}else setVB()}});
const up=e=>{ptrs.delete(e.pointerId)};addEventListener('pointerup',up);addEventListener('pointercancel',up);
svg.addEventListener('wheel',e=>{e.preventDefault();const[fx,fy]=rel(e.clientX,e.clientY);zm(e.deltaY<0?1.25:.8,fx,fy)},{passive:false});
svg.addEventListener('click',e=>{if(moved)return;const t=e.target.dataset;if(t.id)show(t.id);else if(t.cl!==undefined){const c=clusters[+t.cl];const xs=c.m.map(s=>px(s.lng)),ys=c.m.map(s=>py(s.lat));const span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys));setView((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2,Math.max(span*2.4,vb[2]/3))}else if(t.stop){const s=D.stops.find(x=>x.id==t.stop);show(s.par)}});
const tip=$('#tip');svg.addEventListener('pointermove',e=>{if(e.pointerType!='mouse')return;const t=e.target.dataset;let n='';if(t.id)n=D.sites.find(x=>x.id==t.id).n;else if(t.cl!==undefined)n=clusters[+t.cl].m.length+' sites. Click to zoom in';else if(t.stop)n=D.stops.find(x=>x.id==t.stop).n;if(n){const r=svg.getBoundingClientRect();tip.style.display='block';tip.style.left=e.clientX-r.left+12+'px';tip.style.top=e.clientY-r.top+12+'px';tip.textContent=n}else tip.style.display='none'});
$('#zi').onclick=()=>zm(1.5,.5,.5);$('#zo').onclick=()=>zm(1/1.5,.5,.5);$('#zr').onclick=()=>{vb=home.slice();setVB()};
addEventListener('resize',()=>{fit();setVB()});fit();render();
</script></body></html>
