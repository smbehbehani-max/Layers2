  k5:'الذكاء الاصطناعي حيث يستحق مكانه',t5:'وصل النقاط — والتصريح بذلك',l5:'يستخدم «طبقات» الذكاء الاصطناعي للتفسير والربط والتبسيط، لا للاختلاق أبدًا. كل ما يُولَّد مُعلَّم، وكل ما يُذكر له مصدر.',
  aig:[['now','وضع المستكشف','عناوين فصول وجمل جذب ومسارات موجَّهة تحوّل الفهرس إلى رحلة استكشاف — السجلات نفسها، تُروى للمسافر.'],['now','قصص مصوّرة','في نسخة الكويت، يُعاد سرد البحث قصصًا قصيرة مصوّرة مع إبقاء مراجعها ظاهرة.'],['now','تخمين ذكي','روابط غير مختبَرة بين السجلات، تُعرض فرضياتٍ مع منطقها وأدلتها وكيف يمكن دحضها.'],['now','ذكاء مكاني وزمني','خط زمني من البحر الجوراسي حتى اليوم، ومحميات ومواقع تراث عالمي في كل نسخة.'],['roadmap','تفسير متعدد التخصصات','قراءات متكاملة لكل وجهة: كيف يفسّر الصخر والماء والاستيطان والموئل بعضها بعضًا — مع الفصل بين الدليل والتفسير والفرضية.'],['roadmap','مساعد، وتدفق اكتشافات، ومساهمات','«ماذا أستكشف في يوم واحد قربي؟»، ورصد تلقائي للأبحاث الجديدة للمراجعة، ومساهمات الزوار مع التحقق.']],
  honest:'ميزات «الآن» موجودة في التطبيق اليوم. وميزات «خارطة الطريق» مخطَّطة وستُعلَّم عند وصولها.',
  k6:'تراث مخفي',t6:'أماكن لم تكن تعرف أنك تستطيع زيارتها',l6:`بعض من ${TOTAL} موقعًا في النسخ الست. اضغط على أحدها لفتحه على خريطته.`,
  k7:'رحلتك',t7:'اكتشف · استكشف · خطّط',l7:'صُمم لمن هم على الطريق — من داخل المنطقة أو خارجها، بهاتف، في السيارة، وأحيانًا دون إنترنت.',
  jg:[['اكتشف','ابدأ بدولة أو فئة أو بحث — أو بالخريطة فقط.',['وضعا الباحث والمستكشف','العربية والإنجليزية','بحث في كل المواقع']],['استكشف','افتح موقعًا واقرأه كما تريد: السجل أو القصة أو المصادر.',['مسارات استكشاف موجَّهة','عرض الخط الزمني','المحميات ومواقع التراث العالمي']],['خطّط','خذه معك.',['تتبّع مباشر: المسافة والاتجاه إلى كل موقع','شارك أي موقع برابط','ثبّته؛ يعمل دون إنترنت']]],
  f1:'كل موقع يحمل مصادره. الحقائق مأخوذة من أبحاث منشورة وهيئات التراث والتقارير الرسمية؛ والقصص المصوّرة والتخمينات الذكية مميّزة بوضوح.',
  priv:'الخصوصية',made:'صُنع في الكويت',lang:'English',loading:'جارٍ الفتح…'}};
const store={get(k,d){try{const v=localStorage.getItem('kge-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('kge-'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang','en');if(lang!='ar')lang='en';
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CV={archaeological:'arch',geological:'geo',ecology:'eco',speculative:'spec'};
function render(){const t=T[lang],ar=lang=='ar';document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';
 $('#wm').textContent=ar?'طبقات':'LAYERS';$('#byline').textContent=t.by;['#n1','#n2','#n3'].forEach((s,i)=>$(s).textContent=t.n[i]);
 $('#kick').textContent=t.kick;$('#h1').innerHTML=t.h1;$('#hl').textContent=t.hl;$('#c1').textContent=t.c1;$('#c2').textContent=t.c2;$('#c3').textContent=t.c3;$('#cap').textContent=t.cap;$('#lang').textContent=t.lang;$('#ldt').textContent=t.loading;
 $('#stats').innerHTML=t.stats.map(([n,l])=>`<span><b>${E(n)}</b>${E(l)}</span>`).join('');
 for(const i of [2,3,4,5,6,7]){$('#k'+i).textContent=t['k'+i];$('#t'+i).textContent=t['t'+i];$('#l'+i).textContent=t['l'+i]}
 ['#wl1','#wl2','#wl3'].forEach((s,i)=>$(s).textContent=t.wl[i]);
 $('#legend').innerHTML=t.legend.map(([k,l])=>`<span><i style="background:var(--${k})"></i>${l}</span>`).join('');
 ORDER.forEach(cc=>{const d=DATA[cc],c=CN[cc];$(`[data-n="${cc}"]`).textContent=ar?c.ar:c.en;$(`[data-t="${cc}"]`).textContent=ar?c.tar:c.ten;$(`[data-s="${cc}"]`).textContent=`${t.places(d.n)} · ${d.archaeological} ${t.arch} · ${d.geological} ${t.geo} · ${d.ecology} ${t.eco}`});
 $('#layers3').innerHTML=t.layers3.map(([k,h,p])=>`<div class="tile" style="--c:var(--${k})"><span class="dot"></span><h3>${E(h)}</h3><p>${E(p)}</p></div>`).join('');
 $('#strip').innerHTML=t.strip.map(([h,p,ex],i)=>`<div class="step"><span class="n">0${i+1}</span><h4>${E(h)}</h4><p>${E(p)}</p><div class="ex">${E(ex)}</div></div>`).join('');
 $('#aig').innerHTML=t.aig.map(([k,h,p])=>`<div class="tile"><span class="tag${k=='now'?'':' rm'}">${k=='now'?(ar?'الآن':'Now'):(ar?'خارطة الطريق':'Roadmap')}</span><h3>${E(h)}</h3><p>${E(p)}</p></div>`).join('');
 $('#honest').textContent=t.honest;
 $('#show').innerHTML=SHOW.map(s=>`<a class="sh" href="#${s.cc}/p=${encodeURIComponent(s.id)}" style="--c:var(--${CV[s.c]})"><span class="pill">${E(ar?{arch:'آثار',geo:'جيولوجيا',eco:'بيئة',spec:'تخمين ذكي'}[CV[s.c]]:{arch:'Archaeology',geo:'Geology',eco:'Ecology',spec:'AI speculation'}[CV[s.c]])}</span><span class="cc">${E(ar?CN[s.cc].ar:CN[s.cc].en)}</span><h4>${E(ar?s.ta:s.te)}</h4><p>${E(ar?s.na:s.n)}</p></a>`).join('');
 $('#jg').innerHTML=t.jg.map(([h,p,ul])=>`<div class="j"><h4>${E(h)}</h4><p>${E(p)}</p><ul>${ul.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`).join('');
 $('#f1').textContent=t.f1;$('#fp').textContent=t.priv;$('#fm').textContent=t.made;
 document.title=ar?'طبقات · Layers':'Layers · طبقات'}
$('#lang').addEventListener('click',()=>{lang=lang=='ar'?'en':'ar';store.set('lang',lang);render()});
document.querySelectorAll('.cs').forEach(p=>{const cc=p.dataset.cc;p.addEventListener('click',()=>openCC(cc));
 p.addEventListener('mouseenter',()=>$(`.card[data-cc="${cc}"]`).classList.add('hi'));p.addEventListener('mouseleave',()=>$(`.card[data-cc="${cc}"]`).classList.remove('hi'))});
document.querySelectorAll('.card,.bd').forEach(a=>{const cc=a.dataset.cc;a.addEventListener('mouseenter',()=>$(`.cs[data-cc="${cc}"]`).classList.add('hi'));a.addEventListener('mouseleave',()=>$(`.cs[data-cc="${cc}"]`).classList.remove('hi'))});
render();
/* ---- country editions open inside a full-screen frame in this same file ---- */
const frame=$('#frame');let cur=null;
function setHash(h){try{history.replaceState(null,'',location.pathname+location.search+(h?'#'+h:''))}catch(e){try{location.hash=h}catch(e2){}}}
function openCC(cc,sub){const el=document.getElementById('ed-'+cc);if(!el||!CN[cc])return;
 const src=el.textContent.replace(/<\\\/script/g,'</script');
 setHash(cc+(sub?'/'+sub:''));cur=cc;frame.dataset.hash=sub?'#'+sub:'';frame.dataset.base=BASE;
 document.body.classList.add('open','loading');frame.srcdoc=src;
 frame.onload=()=>{document.body.classList.remove('loading');try{frame.contentWindow.focus()}catch(e){}};
 setTimeout(()=>document.body.classList.remove('loading'),4000)}
function closeCC(){cur=null;frame.srcdoc='';frame.removeAttribute('srcdoc');document.body.classList.remove('open','loading');setHash('');try{window.scrollTo(0,0)}catch(e){}}
addEventListener('message',e=>{const d=e.data;if(!d||!d.layers)return;
 if(d.layers=='home')closeCC();
 else if(d.layers=='open'&&CN[d.cc])openCC(d.cc);
 else if(d.layers=='hash'&&cur){setHash(cur+(d.h?'/'+d.h.slice(1):''))}});
addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const m=/^#([a-z]{2})(?:\/(.*))?$/.exec(a.getAttribute('href'));if(m&&CN[m[1]]){e.preventDefault();openCC(m[1],m[2])}});
function fromHash(){const h=location.hash;let m=/^#([a-z]{2})(?:\/(.*))?$/.exec(h);
 if(m&&CN[m[1]]){if(cur==m[1]){frame.dataset.hash=m[2]?'#'+m[2]:'';try{frame.contentWindow.route&&frame.contentWindow.route()}catch(e){}}else openCC(m[1],m[2]);return}
 const p=/^#p=(.+)$/.exec(h);if(p){let id='';try{id=decodeURIComponent(p[1])}catch(e){id=p[1]}const cc=IDX[id];if(cc){openCC(cc,'p='+p[1]);return}}
 if(cur&&!m)closeCC()}
addEventListener('hashchange',fromHash);
if(document.readyState=='loading')addEventListener('DOMContentLoaded',fromHash);else fromHash();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
