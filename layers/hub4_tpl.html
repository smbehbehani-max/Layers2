<!doctype html>
<html lang="en" class="__MODE__">
<head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LAYERS by GEOHERITAGE</title>
<meta name="description" content="LAYERS — Discover the Gulf Beyond the Ordinary. One landscape, multiple stories: geological, archaeological and ecological layers of six Gulf countries, connected by AI.">
<meta name="theme-color" content="#fbeedb">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Layers"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta property="og:description" content="One landscape. Multiple stories."><meta property="og:url" content="__BASE__"><meta property="og:image" content="__BASE__og-kw.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--sea:#2c6e72;--land:#ece3cf;--coast:#7b6a4c;--panel:#f7f8f5;--panel-2:#eef1ec;--ink:#1a2a2b;--mut:#5d6d6c;--line:#d5dcd6;--arch:#b4521c;--geo:#5847b0;--eco:#2c7a4c;--gold:#c99a2e;--cream:#fbeedb;--brown:#3a1d10;
 --f-disp:"Newsreader",Georgia,"Times New Roman",serif;--f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--shadow:0 10px 30px rgba(58,29,16,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#f7f8f5}}
:root[data-theme="dark"]{--panel:#f7f8f5}
__KV__
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--panel);color:var(--ink);font-family:var(--f-body);line-height:1.5}
body.open{overflow:hidden}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Geeza Pro",system-ui,sans-serif}
a{color:inherit}
#lang{position:fixed;top:max(14px,env(safe-area-inset-top));inset-inline-end:16px;z-index:20;border:1px solid rgba(58,29,16,.18);background:rgba(255,250,240,.75);backdrop-filter:blur(8px);color:var(--brown);border-radius:999px;padding:7px 14px;font:600 14px var(--f-body);cursor:pointer}
/* ===== HERO ===== */
.hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(#fbeedb 0%,#f6dfbd 45%,#efc597 100%)}
.sun{position:absolute;left:19%;top:38%;width:44vmin;height:44vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#ffe8b0 0%,rgba(247,200,110,.9) 45%,rgba(247,200,110,0) 70%);animation:sunrise 2.4s cubic-bezier(.2,.8,.2,1) both,glow 7s ease-in-out 2.4s infinite}
html[dir=rtl] .sun{left:81%}
@keyframes sunrise{from{opacity:0;transform:translate(-50%,-10%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.08)}}
.bands{position:absolute;left:0;right:0;bottom:0;height:42%;width:100%;display:block}
.bands path{animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
.bands path:nth-child(1){animation-delay:.2s}.bands path:nth-child(2){animation-delay:.35s}.bands path:nth-child(3){animation-delay:.5s}.bands path:nth-child(4){animation-delay:.65s}
.bands path:nth-child(5){animation-delay:.8s}.bands path:nth-child(6){animation-delay:.95s}.bands path:nth-child(7){animation-delay:1.1s}.bands path:nth-child(8){animation-delay:1.25s}
@keyframes rise{from{transform:translateY(420px);opacity:0}to{transform:none;opacity:1}}
.camel{position:absolute;bottom:34.2%;left:17%;height:21%;aspect-ratio:340/310;transform:translateX(-50%);animation:camelIn 1.6s cubic-bezier(.2,.8,.2,1) 1.4s both}
.camel svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 6px 9px rgba(91,42,23,.35))}
.camel g.bob{animation:bob 3.4s ease-in-out 3s infinite;transform-origin:50% 100%}
html[dir=rtl] .camel{left:83%}html[dir=rtl] .camel svg{transform:scaleX(-1)}
@keyframes camelIn{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-4px)}}
.hin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:9vh 20px 0;z-index:2}
.hlogo{width:68px;height:68px;margin-bottom:16px;filter:drop-shadow(0 4px 10px rgba(58,29,16,.25));animation:fade 1s ease .2s both}.hlogo svg{width:100%;height:100%;display:block}
.word{font:600 clamp(52px,11vw,124px)/.95 var(--f-disp);letter-spacing:.2em;margin:0;padding-inline-start:.2em;color:var(--brown)}
.word span{display:inline-block;animation:letter .9s cubic-bezier(.2,.8,.2,1) both}
.word span:nth-child(1){animation-delay:.5s}.word span:nth-child(2){animation-delay:.6s}.word span:nth-child(3){animation-delay:.7s}.word span:nth-child(4){animation-delay:.8s}.word span:nth-child(5){animation-delay:.9s}.word span:nth-child(6){animation-delay:1s}
@keyframes letter{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.by{font:600 12.5px var(--f-body);letter-spacing:.32em;text-transform:uppercase;color:var(--arch);margin:14px 0 0;animation:fade 1s ease 1.3s both}
.tagl{font:400 italic clamp(20px,2.6vw,30px)/1.25 var(--f-disp);color:var(--brown);margin:18px 0 26px;animation:fade 1s ease 1.7s both;max-width:20em}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:14px 26px;font:600 16px var(--f-body);text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s;background:var(--brown);color:#fffaf0;box-shadow:0 8px 20px rgba(58,29,16,.25);animation:fade 1s ease 2.1s both}
.btn:hover{transform:translateY(-2px)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.down{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:3;width:26px;height:40px;border:2px solid rgba(255,250,240,.8);border-radius:14px;animation:fade 1s ease 2.6s both}
.down::after{content:'';position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fffaf0;animation:scrolly 1.8s ease-in-out infinite}
@keyframes scrolly{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
html.pc .hin{padding-top:10vh}
html.mob .camel{left:24%;height:14%;bottom:32.8%}html.mob .sun{left:24%;top:58%;width:52vmin;height:52vmin}html.mob .bands{height:40%}
@media (max-width:640px){.camel{left:24%;height:14%;bottom:32.8%}.sun{left:24%;top:58%;width:52vmin;height:52vmin}.bands{height:40%}}
html[dir=rtl].mob .camel{left:76%}
/* ===== SECTIONS ===== */
section{padding:72px 20px;text-align:center;overflow:hidden}
.kick{font:600 12px var(--f-body);letter-spacing:.28em;text-transform:uppercase;color:var(--arch);margin:0 0 12px}
h2{font:600 clamp(32px,5vw,58px)/1.06 var(--f-disp);margin:0 auto;letter-spacing:-.01em;max-width:14em;color:var(--ink)}
.sub{font-size:clamp(16px,1.8vw,19px);color:var(--mut);margin:14px auto 0;max-width:30em}
.rv{transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.js .rv{opacity:0;transform:translateY(30px)}.js .rv.in{opacity:1;transform:none}
/* strata loop */
.stack{width:min(420px,86vw);margin:36px auto 30px}
.stack svg{width:100%;height:auto;display:block;overflow:visible}
.sb{animation:split 6s cubic-bezier(.6,0,.3,1) infinite}
.sb.b1{--d:-26px}.sb.b2{--d:0px}.sb.b3{--d:26px}
@keyframes split{0%,12%{transform:translateY(0)}35%,70%{transform:translateY(var(--d))}92%,100%{transform:translateY(0)}}
.sl{animation:labels 6s ease infinite;font:600 17px var(--f-body);fill:#fffaf0}
@keyframes labels{0%,25%{opacity:0}38%,66%{opacity:1}80%,100%{opacity:0}}
.sl.ar{display:none}html[dir=rtl] .sl.en{display:none}html[dir=rtl] .sl.ar{display:block}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:980px;margin:0 auto}
html.mob .three{grid-template-columns:1fr;max-width:420px}@media (max-width:640px){.three{grid-template-columns:1fr;max-width:420px}}
.lay{border-radius:20px;overflow:hidden;background:#fff;box-shadow:var(--shadow);animation:float 6s ease-in-out infinite}
.lay:nth-child(2){animation-delay:-2s}.lay:nth-child(3){animation-delay:-4s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lay .art svg{display:block;width:100%;height:auto}
.lay b{display:flex;align-items:center;justify-content:center;gap:9px;font:600 21px var(--f-disp);padding:14px 10px 16px}
.lay b i{width:11px;height:11px;border-radius:50%;background:var(--c)}
__ARTCSS__
/* AI */
.ai{background:linear-gradient(#f7f8f5,#eef1ec)}
.net{width:min(520px,90vw);margin:34px auto 6px}
.net svg{width:100%;height:auto;display:block;overflow:visible}
.ln{fill:none;stroke-width:2.4;stroke-dasharray:6 8;animation:dash 2.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-56}}
.nd{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.nd.n2{animation-delay:-1s}.nd.n3{animation-delay:-2s}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.core{animation:spin 18s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{fill:none;stroke:var(--gold);stroke-width:2;animation:ring 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(1.9);opacity:0}}
.nlab{font:600 15px var(--f-body);fill:var(--ink);text-anchor:middle}
.nlab.ar{display:none}html[dir=rtl] .nlab.en{display:none}html[dir=rtl] .nlab.ar{display:block}
.big{font:600 italic clamp(26px,3.6vw,40px)/1.2 var(--f-disp);color:var(--sea);margin:40px auto 0;max-width:18em}
/* explore */
.explore{background:linear-gradient(#eef1ec,#f7f8f5)}
.map{position:relative;background:var(--sea);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:__W__/__H__;max-width:900px;margin:34px auto 20px}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cs{fill:var(--land);stroke:var(--land);stroke-width:1.4;vector-effect:non-scaling-stroke;transition:fill .2s,stroke .2s;cursor:pointer}
.cs.hi,.cs:hover{fill:#f8f1dd;stroke:#f8f1dd}
.ld{stroke:rgba(255,250,240,.7);stroke-width:1.5;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}.ldp{fill:#fffaf0}
.wl{fill:var(--land);opacity:.75;font-family:var(--f-disp);font-style:italic;text-anchor:middle;letter-spacing:.06em;font-size:30px}
.bd{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#fffaf0}
.bdl{width:48px;height:48px;display:block;filter:drop-shadow(0 2px 4px rgba(10,40,42,.4));animation:pop 3.6s ease-in-out infinite}.bdl svg{width:100%;height:100%;display:block}
.bd:nth-of-type(2) .bdl{animation-delay:-.6s}.bd:nth-of-type(3) .bdl{animation-delay:-1.2s}.bd:nth-of-type(4) .bdl{animation-delay:-1.8s}.bd:nth-of-type(5) .bdl{animation-delay:-2.4s}.bd:nth-of-type(6) .bdl{animation-delay:-3s}
@keyframes pop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bd:hover .bdl{transform:scale(1.1)}
.bdn{font:600 12.5px var(--f-body);text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
.bdc{display:none}
@media (max-width:520px){.bdl{width:36px;height:36px}.bdn{display:none}.wl{font-size:34px}.map{border-radius:18px}}
html.mob .bdl{width:36px;height:36px}html.mob .bdn{display:none}html.mob .wl{font-size:34px}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:900px;margin:0 auto}
html.mob .pills{grid-template-columns:1fr 1fr}@media (max-width:640px){.pills{grid-template-columns:1fr 1fr}}
.pill{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:var(--ink);font:600 16px var(--f-disp);transition:transform .15s,box-shadow .15s}
.pill:hover,.pill.hi{transform:translateY(-2px);box-shadow:var(--shadow)}
.pill span.l{width:40px;height:40px;flex:none}.pill span.l svg{width:100%;height:100%;display:block}
footer{padding:30px 20px 44px;text-align:center;color:var(--mut);font-size:13px}
footer .gh{font:600 13px var(--f-body);letter-spacing:.24em;color:var(--brown);margin:0 0 6px}footer .gh b{color:var(--sea)}
footer p{margin:6px auto;max-width:40em}footer a{color:var(--sea);text-decoration:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
#frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--panel);z-index:50}
body.open #frame{display:block}
#loading{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:var(--panel);color:var(--mut);font-size:14px}
body.loading #loading{display:flex}
</style></head>
<body>
<button id="lang" aria-label="العربية">[[=lang]]</button>

<header class="hero">
 <div class="sun"></div>
 <svg class="bands" viewBox="-10 470 1030 554" preserveAspectRatio="none" aria-hidden="true">__BANDS__</svg>
 <div class="camel"><svg viewBox="-200 -365 400 370" aria-hidden="true"><g class="bob">__CAMEL__</g></svg></div>
 <div class="hin">
  <div class="hlogo">__LOGO__</div>
  <h1 class="word" dir="ltr" aria-label="LAYERS"><span>L</span><span>A</span><span>Y</span><span>E</span><span>R</span><span>S</span></h1>
  <p class="by">[[by]]</p>
  <p class="tagl">[[tag1]]</p>
  <a class="btn" href="#explore">[[c1]]</a>
 </div>
 <a class="down" href="#one" aria-label="Scroll"></a>
</header>

<section id="one">
 <p class="kick rv">[[k2]]</p>
 <h2 class="rv">[[t2]]</h2>
 <div class="stack rv">
  <svg viewBox="0 0 400 210" aria-hidden="true">
   <g class="sb b1"><rect x="20" y="20" width="360" height="54" rx="12" fill="#2c7a4c"/><text class="sl en" x="200" y="53" text-anchor="middle">[[=st1]]</text><text class="sl ar" x="200" y="53" text-anchor="middle">البيئة</text></g>
   <g class="sb b2"><rect x="20" y="78" width="360" height="54" rx="12" fill="#b4521c"/><text class="sl en" x="200" y="111" text-anchor="middle">[[=st2]]</text><text class="sl ar" x="200" y="111" text-anchor="middle">الآثار</text></g>
   <g class="sb b3"><rect x="20" y="136" width="360" height="54" rx="12" fill="#5847b0"/><text class="sl en" x="200" y="169" text-anchor="middle">[[=st3]]</text><text class="sl ar" x="200" y="169" text-anchor="middle">الجيولوجيا</text></g>
  </svg>
 </div>
 <div class="three">
  <div class="lay rv" style="--c:var(--geo)"><div class="art">__ART_G__</div><b><i></i>[[g1]]</b></div>
  <div class="lay rv" style="--c:var(--arch)"><div class="art">__ART_A__</div><b><i></i>[[g2]]</b></div>
  <div class="lay rv" style="--c:var(--eco)"><div class="art">__ART_E__</div><b><i></i>[[g3]]</b></div>
 </div>
</section>

<section class="ai" id="ai">
 <p class="kick rv">[[k3]]</p>
 <h2 class="rv">[[ai]]</h2>
 <p class="sub rv">[[aid]]</p>
 <div class="net rv">
  <svg viewBox="0 0 520 330" aria-hidden="true">
   <path class="ln" d="M260 165 L100 70" stroke="#5847b0"/><path class="ln" d="M260 165 L420 70" stroke="#b4521c"/><path class="ln" d="M260 165 L260 290" stroke="#2c7a4c"/>
   <path class="ln" d="M100 70 Q260 0 420 70" stroke="#c99a2e" style="animation-duration:3s"/><path class="ln" d="M420 70 Q430 230 260 290" stroke="#c99a2e" style="animation-duration:3.4s"/><path class="ln" d="M260 290 Q90 230 100 70" stroke="#c99a2e" style="animation-duration:3.8s"/>
   <circle class="ring" cx="260" cy="165" r="34"/>
   <g class="core"><circle cx="260" cy="165" r="30" fill="#1a2a2b"/><path d="M260 147v36M242 165h36M247 152l26 26M273 152l-26 26" stroke="#c99a2e" stroke-width="3" stroke-linecap="round"/></g>
   <circle class="nd n1" cx="100" cy="70" r="24" fill="#5847b0"/><circle class="nd n2" cx="420" cy="70" r="24" fill="#b4521c"/><circle class="nd n3" cx="260" cy="290" r="24" fill="#2c7a4c"/>
   <text class="nlab en" x="100" y="30">[[=g1]]</text><text class="nlab ar" x="100" y="30">جيولوجيا</text>
   <text class="nlab en" x="420" y="30">[[=g2]]</text><text class="nlab ar" x="420" y="30">آثار</text>
   <text class="nlab en" x="390" y="300">[[=g3]]</text><text class="nlab ar" x="380" y="300">بيئة</text>
  </svg>
 </div>
 <p class="big rv">[[tag2]]</p>
</section>

<section class="explore" id="explore">
 <p class="kick rv">[[k4]]</p>
 <h2 class="rv">[[t4]]</h2>
 <div class="map rv">
  <svg viewBox="0 __VY0__ __W__ __H__" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the Arabian Gulf countries"><defs><filter id="lsh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b2a2c" flood-opacity=".35"/></filter></defs>
   <g filter="url(#lsh)">__SHAPES__</g>__WL__<g>__LEADERS__</g>
  </svg>
  __BADGES__
 </div>
 <div class="pills">__PILLS__</div>
</section>

<footer>
 <p class="gh"><b>GEO</b>HERITAGE</p>
 <p>[[f1]]</p>
 <p><a href="privacy.html">[[priv]]</a> · <span>[[made]]</span></p>
</footer>
<div id="loading"><span>[[loading]]</span></div>
<iframe id="frame" title="Layers country edition" allow="geolocation; clipboard-write; web-share"></iframe>

<script>
(function(){
document.documentElement.classList.add('js');
var TX=__TEXTS__,CN=__CN__,IDX=__IDX__,BASE='__BASE__';
var store={get:function(k,d){try{var v=localStorage.getItem('kge-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem('kge-'+k,JSON.stringify(v))}catch(e){}}};
var lang=store.get('lang','en');if(lang!='ar')lang='en';
function $(s){return document.querySelector(s)}
function each(sel,fn){var l=document.querySelectorAll(sel);for(var i=0;i<l.length;i++)fn(l[i])}
function render(){var t=TX[lang],ar=lang=='ar';document.documentElement.lang=lang;document.documentElement.dir=ar?'rtl':'ltr';
 each('[data-i]',function(el){var k=el.getAttribute('data-i');if(k in t)el.textContent=t[k]});
 $('#lang').textContent=t.lang;document.title=ar?'طبقات · جيوهيريتيج':'LAYERS by GEOHERITAGE'}
$('#lang').addEventListener('click',function(){lang=lang=='ar'?'en':'ar';store.set('lang',lang);render()});
if(lang=='ar')render();
/* reveal on scroll */
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.15});each('.rv',function(el){io.observe(el)})}else each('.rv',function(el){el.classList.add('in')});
/* map hover */
each('.cs',function(p){var cc=p.getAttribute('data-cc');p.addEventListener('click',function(){openCC(cc)});
 p.addEventListener('mouseenter',function(){var c=$('.pill[data-cc="'+cc+'"]');c&&c.classList.add('hi')});p.addEventListener('mouseleave',function(){var c=$('.pill[data-cc="'+cc+'"]');c&&c.classList.remove('hi')})});
each('.pill,.bd',function(a){var cc=a.getAttribute('data-cc');a.addEventListener('mouseenter',function(){var c=$('.cs[data-cc="'+cc+'"]');c&&c.classList.add('hi')});a.addEventListener('mouseleave',function(){var c=$('.cs[data-cc="'+cc+'"]');c&&c.classList.remove('hi')})});
/* country editions open inside a full-screen frame in this same file */
var frame=$('#frame'),cur=null;
function setHash(h){try{history.replaceState(null,'',location.pathname+location.search+(h?'#'+h:''))}catch(e){}}
function openCC(cc,sub){var el=document.getElementById('ed-'+cc);if(!el||!CN[cc])return;
 var src=el.textContent.replace(/<\\\/script/g,'</script');
 setHash(cc+(sub?'/'+sub:''));cur=cc;frame.setAttribute('data-hash',sub?'#'+sub:'');frame.setAttribute('data-base',BASE);
 document.body.classList.add('open');document.body.classList.add('loading');
 frame.onload=function(){document.body.classList.remove('loading');try{frame.contentWindow.focus()}catch(e){}};
 frame.srcdoc=src;setTimeout(function(){document.body.classList.remove('loading')},4000)}
function closeCC(){cur=null;frame.srcdoc='';frame.removeAttribute('srcdoc');document.body.classList.remove('open');document.body.classList.remove('loading');setHash('');var x=$('#explore');try{x&&x.scrollIntoView()}catch(e){}}
addEventListener('message',function(e){var d=e.data;if(!d||!d.layers)return;
 if(d.layers=='home')closeCC();
 else if(d.layers=='open'&&CN[d.cc])openCC(d.cc);
 else if(d.layers=='hash'&&cur){setHash(cur+(d.h?'/'+d.h.slice(1):''))}});
addEventListener('click',function(e){var a=e.target.closest?e.target.closest('a[href^="#"]'):null;if(!a)return;var m=/^#([a-z]{2})(?:\/(.*))?$/.exec(a.getAttribute('href'));if(m&&CN[m[1]]){e.preventDefault();openCC(m[1],m[2])}});
function fromHash(){var h=location.hash,m=/^#([a-z]{2})(?:\/(.*))?$/.exec(h);
 if(m&&CN[m[1]]){if(cur==m[1]){frame.setAttribute('data-hash',m[2]?'#'+m[2]:'');try{frame.contentWindow.route&&frame.contentWindow.route()}catch(e){}}else openCC(m[1],m[2]);return}
 var p=/^#p=(.+)$/.exec(h);if(p){var id='';try{id=decodeURIComponent(p[1])}catch(e){id=p[1]}var cc=IDX[id];if(cc){openCC(cc,'p='+p[1]);return}}
 if(cur&&!m)closeCC()}
addEventListener('hashchange',fromHash);
if(document.readyState=='loading')addEventListener('DOMContentLoaded',fromHash);else fromHash();
if('serviceWorker' in navigator&&location.protocol=='https:'&&/github\.io$/.test(location.hostname))addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
