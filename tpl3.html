<style>
/* Layout: field atlas. Header + tool strip on top, tile rail on the reading-start side, map fills the rest, detail sheet slides over the map. */
:root{
  --sea:#2c6e72;--sea-2:#3f8286;--land:#ece3cf;--coast:#7b6a4c;
  --panel:#f7f8f5;--panel-2:#eef1ec;--ink:#1a2a2b;--mut:#5d6d6c;--line:#d5dcd6;
  --arch:#b4521c;--geo:#5847b0;--eco:#2c7a4c;--spec:#bf2f7d;--gold:#c99a2e;--seaT:#2c6e72;
  --f-disp:"Newsreader",Georgia,"Times New Roman",serif;--f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-tile:10px;--shadow:0 6px 24px rgba(10,40,42,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sea:#0a2125;--sea-2:#12333a;--land:#3b4b43;--coast:#7f8f84;--panel:#121c1c;--panel-2:#182424;--ink:#e6ecea;--mut:#93a5a2;--line:#273534;
  --arch:#e08a4f;--geo:#9d8ff0;--eco:#5ec48a;--spec:#f06aae;--gold:#e2b850;--seaT:#7cc6c9;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--sea:#0a2125;--sea-2:#12333a;--land:#3b4b43;--coast:#7f8f84;--panel:#121c1c;--panel-2:#182424;--ink:#e6ecea;--mut:#93a5a2;--line:#273534;
  --arch:#e08a4f;--geo:#9d8ff0;--eco:#5ec48a;--spec:#f06aae;--gold:#e2b850;--seaT:#7cc6c9;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
:lang(ar){--f-disp:"Amiri","Noto Naskh Arabic",serif;--f-body:"IBM Plex Sans Arabic","Noto Sans Arabic",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--panel);color:var(--ink);font:15px/1.5 var(--f-body)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
/* header */
header{display:flex;align-items:center;gap:12px;padding:10px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--panel)}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0;margin-inline-end:auto}.brandrow .brand{margin-inline-end:0}
.lgs{display:flex;align-items:center;gap:6px;flex:none}
.lg{border:0;padding:0;background:none;cursor:pointer;line-height:0;border-radius:24%;transition:transform .15s}
.lg svg{width:30px;height:30px;display:block;filter:saturate(.7) opacity(.9)}
.lg.on svg{width:46px;height:46px;filter:drop-shadow(0 1px 2px rgba(58,29,16,.28))}
.lg:hover{transform:translateY(-1px)}.lg:hover svg{filter:none}.lg.on:hover svg{filter:drop-shadow(0 2px 4px rgba(58,29,16,.35))}
.lg:focus-visible{outline:2px solid var(--seaT);outline-offset:2px}
.brandrow .lgs{margin-inline-start:6px;padding-inline-start:10px;border-inline-start:1px solid var(--line)}
.lg.on svg{transition:none}.lg .v-on{display:none}.lg.on .v-on{display:block}.lg.on .v-sm{display:none}.brand h1 span{transition:opacity .2s}
.soon{position:fixed;inset:0;z-index:60;background:rgba(15,28,29,.55);display:grid;place-items:center;padding:16px}
.soon-in{position:relative;width:min(460px,100%);background:var(--panel);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.35);padding:22px 24px 22px;text-align:center}
.soon-in .lgbig{width:64px;height:64px;margin:0 auto 6px}.soon-in .lgbig svg{width:100%;height:100%}
.soon-map{width:100%;height:230px;margin:6px 0 10px}.soon-map path{fill:#c9cdc8;stroke:#9ea49d;stroke-width:3;stroke-linejoin:round}
.soon-in h2{margin:0;font:700 26px/1.2 var(--f-disp)}
.soon-pill{display:inline-block;margin:10px 0 8px;padding:5px 14px;border-radius:99px;background:var(--ink);color:var(--panel);font:600 14px var(--f-body);letter-spacing:.04em}
.soon-in p{margin:0 0 16px;color:var(--mut);font-size:15px;line-height:1.5}
.soon-in .back{border:0;border-radius:99px;padding:10px 18px;background:var(--seaT);color:#fff;font:600 15px var(--f-body);cursor:pointer}
.soon-in .x{color:var(--ink);background:rgba(0,0,0,.07)}
.hw-foot{margin-top:14px;display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);font-size:13px}.hw-foot .lnk{border:0;background:none;color:var(--seaT);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px}

function drawLinks(cl,u){const g=$('#links');if(!g)return;const pos=id=>cl.find(c=>c.m.some(m=>m.id==id));
 const pairs=[],add=(a,b,on)=>{const p=pairs.find(p=>p[0]==a&&p[1]==b);if(p){p[2]=p[2]||on}else pairs.push([a,b,on])};

 if(f&&f.spec&&vis.includes(f))f.spec.lk.forEach(l=>add(f.id,l[0],1));

function hwBuild(){const t=HW[lang];
 $('#how').innerHTML=`<div class="hw-in" role="document"><button class="hw-x" aria-label="${E(L().close)}">×</button><h2>${E(t.title)}</h2><p>${E(t.sub)}</p>
 <div class="hw-box"><svg id="hw-flow" viewBox="0 70 1000 250" role="img" aria-label="${E(t.title)}"><path id="hw-track" d=""/><path id="hw-on" d=""/><g id="hw-st"></g><circle id="hw-pk" r="8" cx="92" cy="190"/></svg></div>
 <div class="hw-cap" aria-live="polite"><div class="hw-num" id="hw-num">1</div><div><span class="hw-tag auto" id="hw-tag"></span><h3 id="hw-ttl"></h3><p id="hw-txt"></p><div class="hw-ex" id="hw-ex"></div></div></div>
 <div class="hw-ctl"><button id="hw-prev">${E(t.back)}</button><button class="pri" id="hw-play"></button><button id="hw-next">${E(t.next)}</button><div class="hw-dots" id="hw-dots">${t.steps.map(()=>'<i></i>').join('')}</div></div>
 <div class="hw-strip">${t.strip.map(s=>`<div><div class="k ${s[0]}">${E(s[1])}</div><h4>${E(s[2])}</h4><p>${E(s[3])}</p></div>`).join('')}</div><div class="hw-foot"><button class="lnk" id="hw-about">${E(INS[lang].about)}</button><span>· v${APP_VERSION}</span></div></div>`;
 hwD='M'+hX(0)+' '+hY;for(let i=1;i<7;i++){const a=hX(i-1),b=hX(i);hwD+=` C${a+50} ${hY+(i%2?-46:46)} ${b-50} ${hY+(i%2?-46:46)} ${b} ${hY}`}
 $('#hw-track').setAttribute('d',hwD);$('#hw-on').setAttribute('d',hwD);
 const g0=$('#hw-st');t.steps.forEach((s,i)=>{const g=document.createElementNS(hns,'g');g.setAttribute('class','hw-st');g.setAttribute('transform',`translate(${hX(i)} ${hY})`);g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',`${i+1}: ${s[0]}`);g.dataset.i=i;
  const w=HWW[i],col=w=='you'?'var(--arch)':w=='all'?'var(--gold)':'var(--seaT)';
  g.innerHTML=`<circle class="ring" r="44"/>${icon(i)}<text class="hw-who" y="${i==2?-84:-60}" style="fill:${col}">${E(t[w])}</text><text class="hw-lbl" y="76">${E(s[0])}</text><text class="hw-sub" y="93">${E(s[1])}</text>`;g0.appendChild(g)});
 const tmp=document.createElementNS(hns,'path');$('#hw-flow').appendChild(tmp);hwLens=[0];for(let i=1;i<7;i++){tmp.setAttribute('d',hwD.split(' C').slice(0,i+1).join(' C'));hwLens.push(tmp.getTotalLength())}tmp.remove();
 hwShow(hwCur,false);hwSetPlay(hwPlay)}
function hwPacket(len){const p=$('#hw-track').getPointAtLength(len);const pk=$('#hw-pk');pk.setAttribute('cx',p.x);pk.setAttribute('cy',p.y);$('#hw-on').style.strokeDasharray=`${len} 99999`}
function hwShow(i,animate){const t=HW[lang],from=hwLens[hwCur],to=hwLens[i];hwCur=i;const s=t.steps[i],w=HWW[i];
 document.querySelectorAll('.hw-st').forEach((g,k)=>{g.classList.toggle('on',k==i);g.classList.toggle('done',k<i)});
 document.querySelectorAll('#hw-dots i').forEach((d,k)=>d.classList.toggle('on',k<=i));
 $('#hw-num').textContent=i+1;$('#hw-ttl').textContent=s[2];$('#hw-txt').textContent=s[3];$('#hw-ex').innerHTML=s[4];
 const tg=$('#hw-tag');tg.className='hw-tag '+(w=='you'?'you':w);tg.textContent=w=='you'?(i==6?t.tAsk:t.tYou):w=='all'?t.tAll:t.tAuto;
 const bx=$('.hw-box');if(bx.scrollWidth>bx.clientWidth){const sc=bx.scrollWidth/1000;bx.scrollTo({left:Math.max(0,hX(i)*sc-bx.clientWidth/2),behavior:hwReduce||!animate?'auto':'smooth'})}
 cancelAnimationFrame(hwAnim);if(!animate||hwReduce){hwPacket(to);return}
 const t0=performance.now();const st=n=>{const k=Math.min(1,(n-t0)/900),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;hwPacket(from+(to-from)*e);if(k<1)hwAnim=requestAnimationFrame(st)};hwAnim=requestAnimationFrame(st)}
function hwSetPlay(p){hwPlay=p;const b=$('#hw-play');if(b)b.textContent=p?HW[lang].pause:HW[lang].play;clearTimeout(hwTimer);if(p)hwTick()}
function hwTick(){hwTimer=setTimeout(()=>{if($('#how').hidden)return;hwShow((hwCur+1)%7,hwCur+1<7);if(hwPlay)hwTick()},hwCur==6?4200:3600)}
function openHow(){$('#how').hidden=false;hwCur=0;hwPlay=!hwReduce;hwBuild();setTimeout(()=>{const b=$('#hw-play');b&&b.focus()},30)}
function closeHow(){$('#how').hidden=true;clearTimeout(hwTimer);cancelAnimationFrame(hwAnim)}
$('#how').onclick=e=>{if(e.target.id=='how')return closeHow();const b=e.target.closest('button');const g=e.target.closest('.hw-st');
 if(g){hwSetPlay(false);hwShow(+g.dataset.i,true);return}if(!b)return;
 if(b.classList.contains('hw-x'))return closeHow();if(b.id=='hw-about')return openAbout();if(b.id=='hw-play')return hwSetPlay(!hwPlay);
 if(b.id=='hw-next'){hwSetPlay(false);hwShow((hwCur+1)%7,true)}if(b.id=='hw-prev'){hwSetPlay(false);hwShow((hwCur+6)%7,true)}};
$('#how').addEventListener('keydown',e=>{if(e.key=='Escape'){e.stopPropagation();closeHow()}const g=e.target.closest&&e.target.closest('.hw-st');if(g&&(e.key=='Enter'||e.key==' ')){e.preventDefault();hwSetPlay(false);hwShow(+g.dataset.i,true)}});
